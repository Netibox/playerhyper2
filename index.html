<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HLS Video Player</title>

    <!-- Video.js CSS -->
    <link
        href="https://vjs.zencdn.net/8.23.4/video-js.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 15px;
        }

        .player-box {
            width: 100%;
            background: #000;
        }

        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        .url-box {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .url-box input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 14px;
        }

        .url-box button {
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            background: #1677ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .url-box button:hover {
            background: #4090ff;
        }

        #status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            background: #222;
            color: #ccc;
            font-size: 14px;
        }

        .vjs-big-play-button {
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="player-box">

        <video
            id="my-video"
            class="video-js vjs-big-play-centered"
            controls
            preload="auto"
            playsinline
        ></video>

    </div>

    <div class="url-box">

        <input
            id="streamUrl"
            type="text"
            value="https://main.24playerhd.com/newplaylist/8da92998e83b1d45b018bd3d/8da92998e83b1d45b018bd3d.m3u8"
        >

        <button id="loadBtn">
            ▶ โหลด
        </button>

    </div>

    <div id="status">
        กำลังเตรียมเครื่องเล่น...
    </div>

</div>


<!-- ==================================================
     Video.js JavaScript
     ================================================== -->

<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>


<script>

    // ==============================================
    // URL ของช่อง
    // ==============================================

    const DEFAULT_URL =
        "https://main.24playerhd.com/newplaylist/8da92998e83b1d45b018bd3d/8da92998e83b1d45b018bd3d.m3u8";


    // ==============================================
    // สถานะ
    // ==============================================

    const statusBox =
        document.getElementById("status");

    const urlInput =
        document.getElementById("streamUrl");

    const loadButton =
        document.getElementById("loadBtn");


    // ==============================================
    // ตรวจสอบ Video.js
    // ==============================================

    if (typeof videojs === "undefined") {

        statusBox.innerHTML =
            "❌ โหลด Video.js ไม่สำเร็จ";

        console.error(
            "Video.js ไม่ถูกโหลด"
        );

    } else {

        console.log(
            "Video.js Version:",
            videojs.VERSION
        );

    }


    // ==============================================
    // สร้าง Player
    // ==============================================

    const player = videojs(
        "my-video",
        {

            controls: true,

            autoplay: false,

            preload: "auto",

            fluid: true,

            responsive: true,

            liveui: true,

            html5: {

                vhs: {

                    overrideNative: true,

                    withCredentials: false

                },

                nativeAudioTracks: false,

                nativeVideoTracks: false

            }

        },

        function () {

            console.log(
                "Video.js พร้อมใช้งาน"
            );

            statusBox.innerHTML =
                "✅ Video.js พร้อมใช้งาน";

        }
    );


    // ==============================================
    // โหลด HLS
    // ==============================================

    function loadStream(url) {

        if (!url) {

            statusBox.innerHTML =
                "❌ ไม่พบ URL";

            return;

        }


        console.log(
            "กำลังโหลด:",
            url
        );


        statusBox.innerHTML =
            "⏳ กำลังโหลดสตรีม...";


        try {

            player.pause();


            /*
             * สำคัญ:
             * ใช้ application/x-mpegURL
             * เพื่อให้ Video.js VHS จัดการ HLS
             */

            player.src({

                src: url,

                type: "application/x-mpegURL"

            });


            player.ready(function () {

                console.log(
                    "Source พร้อม"
                );

            });


        } catch (error) {

            console.error(
                "Load error:",
                error
            );

            statusBox.innerHTML =
                "❌ โหลดสตรีมไม่สำเร็จ";

        }

    }


    // ==============================================
    // กดโหลด
    // ==============================================

    loadButton.addEventListener(
        "click",
        function () {

            const url =
                urlInput.value.trim();

            loadStream(url);

        }
    );


    // ==============================================
    // กด Enter ในช่อง URL
    // ==============================================

    urlInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                loadStream(
                    urlInput.value.trim()
                );

            }

        }
    );


    // ==============================================
    // Player Events
    // ==============================================

    player.on(
        "loadstart",
        function () {

            statusBox.innerHTML =
                "⏳ กำลังเชื่อมต่อสตรีม...";

            console.log(
                "loadstart"
            );

        }
    );


    player.on(
        "loadedmetadata",
        function () {

            statusBox.innerHTML =
                "✅ โหลดข้อมูลสตรีมแล้ว";

            console.log(
                "loadedmetadata"
            );

        }
    );


    player.on(
        "canplay",
        function () {

            statusBox.innerHTML =
                "▶ พร้อมเล่น";

            console.log(
                "canplay"
            );

        }
    );


    player.on(
        "playing",
        function () {

            statusBox.innerHTML =
                "🟢 กำลังเล่น";

            console.log(
                "playing"
            );

        }
    );


    player.on(
        "waiting",
        function () {

            statusBox.innerHTML =
                "⏳ กำลังบัฟเฟอร์...";

        }
    );


    player.on(
        "error",
        function () {

            const error =
                player.error();

            console.error(
                "Video.js Error:",
                error
            );


            if (error) {

                statusBox.innerHTML =
                    "❌ เล่นไม่ได้: " +
                    (error.message || "Unknown error");

            } else {

                statusBox.innerHTML =
                    "❌ เกิดข้อผิดพลาดในการเล่น";

            }

        }
    );


    // ==============================================
    // เริ่มโหลด URL
    // ==============================================

    loadStream(DEFAULT_URL);


</script>

</body>
</html>
