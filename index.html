<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - GitHub Pages</title>
    
    <!-- ดึงสไตล์จาก Cloudflare CDN ซึ่งเปิดได้จากทุกเครือข่ายอินเทอร์เน็ต ไม่โดนบล็อก -->
    <link href="https://cloudflare.com" rel="stylesheet" />
    
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>
<body>

<div class="video-container">
    <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="100%" height="450">
        <source src="https://main.24playerhd.com/newplaylist/8da92998e83b1d45b018bd3d/8da92998e83b1d45b018bd3d.m3u8" type="application/x-mpegURL">
    </video>
</div>

<!-- ดึงสคริปต์หลักจาก Cloudflare CDN -->
<script src="https://cloudflare.com"></script>

<script>
    var player = videojs('my-video', {
        autoplay: false,
        controls: true,
        responsive: true,
        fluid: true,
        html5: {
            vhs: {
                withCredentials: true
            }
        }
    });

    player.on('error', function() {
        console.error('Video Error:', player.error());
    });
</script>

</body>
</html>
